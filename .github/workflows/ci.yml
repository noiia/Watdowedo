name: Watdowedo Pipeline

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Run tests
        run: sudo chmod +x ./launch_test.sh && ./launch_test.sh

      - name: Check watdowedo_app exit status
        run: |
          EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' watdowedo_app)
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "watdowedo_app failed."
            exit $EXIT_CODE
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: ./coverage/coverage.out

  docker-buildx-ubuntu-arm-amd-windows-amd:
    runs-on: ubuntu-latest
    needs: test
    steps:
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Login to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and push multi-platform image
          uses: docker/build-push-action@v4
          with:
            file: Dockerfile
            platforms: linux/amd64,linux/arm64,windows/amd64
            push: true
            tags: n0ianoba/watdowedo:latest
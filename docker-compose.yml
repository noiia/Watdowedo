services:
  watdowedo.db:
    image: postgres:latest
    container_name: ${ENV}.watdowedo_psql
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    networks:
      - watdowedo-network
    volumes:
      - watdowedo_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      timeout: 20s
      interval: 10s
      retries: 10

  watdowedo.pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${ENV}.watdowedo_pgadmin
    restart: always
    networks:
      - watdowedo-network
    volumes:
      - watdowedo_pg_admin:/var/lib/pgadmin
    ports:
      - "82:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      watdowedo.db:
        condition: service_healthy

  watdowedo:
    container_name: ${ENV}.watdowedo_app
    build: .
    depends_on:
      watdowedo.db:
        condition: service_healthy
    networks:
      - watdowedo-network
    ports:
      - "81:8080"
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      TEST_MODE: ${TEST_MODE:-false}
    volumes:
      - ./coverage:/coverage
    command: >
      sh -c "
      if [ ${TEST_MODE} = true ]; then
        echo 'Running in test mode';
        go test -v ./...  | tee /coverage/coverage.out;
        exit_code=$?
        exit $exit_code
      else
        echo 'Starting application';
        ./watdowedo -v
      fi
      "

  container-monitor:
    image: docker:cli
    container_name: ${ENV}.container_monitor
    restart: on-failure
    environment:
      TEST_MODE: ${TEST_MODE:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "
        if ${TEST_MODE}; then
          echo 'Starting container monitor...'
          if [ \"$(docker inspect -f '{{.State.Running}}' test.watdowedo_app 2>/dev/null)\" = 'false' ]; then
            exit_code=$(docker inspect -f '{{.State.ExitCode}}' test.watdowedo_app)
            echo \"watdowedo_app has exited with code $${exit_code}\"
            
            if [ \"$${exit_code}\" != '0' ]; then
              echo \"Container exited with error code $${exit_code}. Taking action...\"
            else
              echo \"Container exited normally with code 0\"
            fi
            exit $${exit_code}
          fi
        fi
      "
    depends_on:
      - watdowedo

volumes:
  watdowedo_db_data:
  watdowedo_pg_admin:
  coverage:

networks:
  watdowedo-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK}/29
          gateway: ${NETWORK_GATEWAY}

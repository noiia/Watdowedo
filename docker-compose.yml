services:
  watdowedo.db:
    image: postgres:latest
    container_name: watdowedo_psql
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    networks:
      - watdowedo-network
    volumes:
      - watdowedo_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      timeout: 20s
      interval: 10s
      retries: 10

  watdowedo.pgadmin:
    image:  dpage/pgadmin4:latest
    container_name: watdowedo_pgadmin
    restart: always
    networks:
      - watdowedo-network
    volumes:
      - watdowedo_pg_admin:/var/lib/pgadmin
    ports:
      - "82:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      watdowedo.db: 
        condition: service_healthy

  watdowedo:
    container_name: watdowedo_app
    build: .
    depends_on:
      watdowedo.db: 
        condition: service_healthy
    networks:
      - watdowedo-network
    ports:
      - "81:8080"
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      TEST_MODE: ${TEST_MODE:-false}
    volumes:
      - ./coverage:/coverage
    command: >
      sh -c "
      if [ ${TEST_MODE} = true ]; then
        echo 'Running in test mode';
        go test ./... -v > /coverage/coverage.out;
      else
        echo 'Starting application';
        ./watdowedo
      fi
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      timeout: 5s
      interval: 10s
      retries: 3

volumes:
  watdowedo_db_data:
  watdowedo_pg_admin:
  coverage:

networks:
  watdowedo-network:
    driver: bridge
    ipam:
      driver: default
      config: 
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1